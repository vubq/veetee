# Copy file này thành config.yaml rồi chỉnh theo máy chạy server.
# config.yaml được .gitignore bỏ qua; không commit API key thật.

server:
  host: "0.0.0.0"
  ws_port: 8000
  http_port: 8003
  log_level: "INFO"
  # Tương thích firmware Xiaozhi nguyên bản: chỉ ngắt khi client gửi abort/listen:start.
  barge_in_policy: "client_only"

asr:
  # Mặc định: Parakeet Vietnamese local + Silero VAD.
  # Có thể đổi thành "deepgram"; khi đó cần api_key và các option Deepgram bên dưới.
  provider: "parakeet_silero"
  api_key: ""
  model: "nvidia/parakeet-ctc-0.6b-vi"
  language: "vi"
  smart_format: true
  interim_results: true
  endpointing_ms: 250
  sample_rate: 16000

  # Parakeet + Silero VAD
  device: "cuda"
  vad_model_path: "models/silero-vad/silero_vad.onnx"
  vad_threshold: 0.5
  vad_threshold_low: 0.3
  min_silence_duration_ms: 450
  min_speech_duration_ms: 160
  speech_start_frames: 2
  pre_speech_pad_ms: 512

  # Tắt mặc định để giữ critical path ASR -> 1 LLM -> TTS.
  # Chỉ bật khi muốn ưu tiên sửa transcript confidence thấp hơn latency.
  text_correction_enabled: false
  text_correction_confidence_threshold: 0.78
  text_correction_timeout_ms: 900
  # Bounded queue để lượt capture cũ không chiếm GPU vô hạn.
  utterance_queue_max: 2
  max_utterance_ms: 30000

llm:
  provider: "omniroute"
  base_url: "http://127.0.0.1:20128/v1"
  api_key: "local-omniroute"
  model: "groq/qwen/qwen3.6-27b"
  temperature: 0.6
  max_tokens: 600
  reasoning_format: "hidden"
  base_prompt: "Bạn là VeeTee, một trợ lý ảo giọng nói tiếng Việt thông minh, thân thiện và hữu ích."
  prompt_template: "agent-base-prompt.txt"

tts:
  provider: "vieneu"
  voice: "Xuân Vĩnh"
  source_voice: "Xuân Vĩnh"
  sample_rate: 24000
  frame_duration_ms: 60
  # Giới hạn audio gửi trước để giảm đuôi âm khi client ngắt lượt.
  send_ahead_ms: 120
  # Backpressure cho bridge VieNeu thread -> async.
  stream_queue_max_chunks: 4
  denoise: true
  temperature: 0.7

# Hành vi hội thoại tự nhiên phía server. Mặc định tắt để giữ luồng cũ.
# Không yêu cầu sửa/build firmware Xiaozhi nguyên bản.
conversation:
  enabled: false
  wake_words:
    - "你好小智"
    - "小爱同学"
    - "小美同学"
    - "VeeTee ơi"
  greeting_enabled: true
  greeting_ai_enabled: true
  greeting_pool_size: 3
  greeting_text: ""  # fallback only if AI generation is unavailable
  audio_cache_enabled: true
  # 0 = tắt tự kết thúc do im lặng.
  idle_timeout_seconds: 120
  exit_commands:
    - "tạm biệt"
    - "kết thúc trò chuyện"
    - "thoát trò chuyện"
  goodbye_enabled: true
  goodbye_ai_enabled: true
  end_intent_ai_enabled: true
  ai_control_timeout_ms: 1800
  goodbye_text: ""  # fallback only if AI generation is unavailable
  # Giá trị khởi điểm cần đo trên thiết bị thật.
  wake_start_wait_ms: 150
  fixed_response_timeout_seconds: 5
  close_grace_ms: 250

latency:
  unified_turn_enabled: true
  first_token_timeout_ms: 4000
  total_turn_timeout_ms: 15000
  context_lookup_timeout_ms: 10

intent:
  enabled: true
  semantic_end_enabled: true
  confirmation_ttl_seconds: 15

memory:
  # Session memory hoạt động local; durable write chỉ bật khi operator gắn
  # trusted_owner_id từ cấu hình server. Không dùng Device-Id/Client-Id làm owner.
  enabled: true
  durable_enabled: false
  database_path: "data/memory.sqlite3"
  trusted_owner_id: ""
  lookup_timeout_ms: 10
  top_k: 6
  max_memory_chars: 2400

tools:
  enabled: true
  native_enabled: true
  mcp_device_enabled: false
  max_calls_per_turn: 3
  schema_limit: 16
  # Mặc định strict one-round. Chỉ profile tổng hợp tool-result mới dùng 2.
  max_llm_rounds_per_turn: 1
  tool_result_synthesis: false
