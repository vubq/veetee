# Copy file này thành config.yaml rồi chỉnh theo máy chạy server.
# config.yaml được .gitignore bỏ qua; không commit API key thật.

server:
  # WebSocket credentials are issued per paired device via OTA activation.
  # The manager dashboard authenticates separately with VEETEE_MANAGEMENT_TOKEN.
  ws_allowed_origins: [] # Same-origin browser accepted; exact extra origins only.
  ws_max_sessions: 8
  ws_hello_timeout_seconds: 5
  timezone: "Asia/Ho_Chi_Minh"
  host: "0.0.0.0"
  ws_port: 8000
  http_port: 8003
  log_level: "INFO"
  # Tương thích firmware Xiaozhi nguyên bản: chỉ ngắt khi client gửi abort/listen:start.
  barge_in_policy: "client_only"

asr:
  # Mặc định: Parakeet Vietnamese local + Silero VAD.
  # Có thể đổi thành "deepgram"; khi đó cần api_key và các option Deepgram bên dưới.
  provider: "parakeet_silero"
  api_key: ""
  model: "nvidia/parakeet-ctc-0.6b-vi"
  language: "vi"
  smart_format: true
  interim_results: true
  endpointing_ms: 250
  sample_rate: 16000

  # Parakeet + Silero VAD
  device: "cuda"
  vad_model_path: "models/silero-vad/silero_vad.onnx"
  vad_threshold: 0.5
  vad_threshold_low: 0.3
  # Khi speech đã bắt đầu, probability dưới ngưỡng này được tính là silence.
  # Default 0.3 giữ behavior cũ; tăng chỉ sau A/B false-cut/WER.
  vad_end_threshold: 0.3
  # Fast profile validated by the small labelled smoke corpus on 2026-09-24:
  # 192ms + speculative ASR kept 0 splits and the same mean WER as the
  # previous 384ms/non-speculative profile while reducing mean TTFA ~20%.
  # Re-certify on a larger noisy/hesitant corpus before treating this as SLA.
  min_silence_duration_ms: 192
  # Start the same local Parakeet inference during trailing silence and reuse
  # it only when speech does not resume and acoustic confidence is high.
  speculative_inference_enabled: true
  speculative_start_silence_ms: 64
  speculative_min_confidence: 0.95
  # Optional second-stage latency optimization: use a high-confidence
  # speculative ASR snapshot to start the SAME AI/tool turn early, but buffer
  # every TurnEvent until ASR final confirms the exact transcript and context.
  # No TTS, tool execution, memory mutation, or lifecycle side effect happens
  # before commit. Requires speculative_inference_enabled=true.
  speculative_llm_enabled: false
  speculative_llm_min_confidence: 0.95
  min_speech_duration_ms: 160
  speech_start_frames: 2
  pre_speech_pad_ms: 512

  # Tắt mặc định để giữ critical path ASR -> 1 LLM -> TTS.
  # Chỉ bật khi muốn ưu tiên sửa transcript confidence thấp hơn latency.
  text_correction_enabled: false
  text_correction_confidence_threshold: 0.78
  text_correction_timeout_ms: 900
  # Bounded queue để lượt capture cũ không chiếm GPU vô hạn.
  utterance_queue_max: 2
  max_utterance_ms: 30000
  # Chẩn đoán ASR: lưu vòng một số ít WAV + JSON sau inference để A/B decoder/model.
  # Ghi file chạy ngoài critical path nên không chặn LLM/TTS.
  diagnostic_capture_enabled: false
  diagnostic_capture_dir: "/tmp/veetee-asr-captures"
  diagnostic_capture_max_files: 20

llm:
  # provider: "groq" (Groq API trực tiếp, quota-aware multi-key) hoặc
  # "omniroute" (gateway local cũ). Không còn OmniRoute trong đường mới.
  provider: "groq"
  base_url: "https://api.groq.com/openai/v1"
  # Chỉ dùng cho provider omniroute legacy; GroqDirect lấy secret từ key pool/env.
  api_key: ""
  model: "qwen/qwen3.8-27b"
  # Pool key Groq: secret CHỈ ở env (GROQ_API_KEY_<alias>), file này chỉ giữ
  # id + quota_group. Số lượng key linh hoạt; pool rỗng = tự quét env.
  # Mỗi alias mặc định một quota_group riêng (quota độc lập).
  # Rỗng = tự quét mọi GROQ_API_KEY_<alias> trong env. Không giới hạn A-D.
  key_pool: []
  # Caps quota theo group (rpm/rpd/tpm/tpd/itpm/otpm). Bỏ trống group nào thì
  # group đó chạy discovery mode (giới hạn in-flight, học caps từ headers).
  # Không bịa quota tài khoản khác.
  quota_groups: {}
  routing:
    headroom_pct: 10.0
    max_attempts: 2
    admission_wait_ms: 60.0
    # Chờ ngắn khi failover gặp quota-group đang có request discovery in-flight.
    # Không áp cho quota đã biết/cạn thật, nên không làm chậm capacity failure bình thường.
    discovery_wait_ms: 750.0
    discovery_max_inflight: 1
    inflight_penalty_s: 0.4
    # Route selection learns first-usable-event latency per quota group.
    # Penalize jitter so a slightly faster-but-spiky key does not dominate p95.
    latency_ewma_alpha: 0.3
    latency_jitter_penalty: 0.75
  # Policy cắt stream LLM thành các đơn vị TTS. Đây là tuning transport/prosody,
  # không phải matcher intent. Có thể A/B để giảm TTFA mà không sửa provider.
  speech_segmentation:
    min_segment_chars: 28
    clause_target_chars: 150
    clause_min_chars: 80
    first_clause_min_chars: 24
    first_clause_min_words: 4
    hard_max_segment_chars: 240
    hard_cut_search_back: 45
    hard_cut_search_forward: 40
    first_segment_min_chars: 8
    first_segment_min_words: 2
    # 0 = disabled. When enabled, the first spoken unit may be cut at a
    # whitespace boundary after this many visible chars to reduce TTFA.
    first_soft_cut_chars: 0
    first_soft_cut_min_words: 3
  temperature: 0.6
  max_tokens: 600
  request_timeout_ms: 15000
  probe_timeout_ms: 8000
  control_timeout_ms: 2000
  # Giữ TCP/TLS Groq qua các khoảng im lặng tự nhiên của hội thoại.
  http_keepalive_seconds: 120
  dns_cache_ttl_seconds: 300
  reasoning_format: "hidden"
  # Effort suy luận cho model mặc định ("none" tắt <think> kiểu Qwen).
  reasoning_effort: "none"
  # Model phụ để A/B test (không thay default). Effort riêng từng model
  # vì gpt-oss chỉ nhận low/medium/high.
  extra_models: ["openai/gpt-oss-20b"]
  model_reasoning_effort:
    "openai/gpt-oss-20b": "low"
  base_prompt: "Bạn là VeeTee, một trợ lý ảo giọng nói tiếng Việt thông minh, thân thiện và hữu ích."
  prompt_template: "agent-base-prompt.txt"
  # Persona budget dùng chung cho API/UI/config/runtime. Over-budget bị reject,
  # không truncate âm thầm. Estimate có safety margin cho tiếng Việt/JSON.
  base_prompt_max_bytes: 32768
  base_prompt_max_tokens: 8000

tts:
  provider: "vieneu"
  voice: "Xuân Vĩnh"
  source_voice: "Xuân Vĩnh"
  sample_rate: 24000
  frame_duration_ms: 60
  # Giới hạn audio gửi trước để giảm đuôi âm khi client ngắt lượt.
  send_ahead_ms: 120
  # Optional: synthesize clause đầu trong lúc chờ ASR final nhưng chỉ buffer
  # local; không gửi audio trước khi transcript final khớp chính xác.
  speculative_prefetch_enabled: false
  # Backpressure cho bridge VieNeu thread -> async. A/B 4/16/64 trên
  # production streaming path không cho thấy buffer lớn giảm contention;
  # giữ 4 để bounded memory và tránh synthesize-ahead vô ích.
  stream_queue_max_chunks: 4
  # Ưu tiên PCM đầu của turn mới hơn continuation segment; aging tránh starvation.
  first_audio_priority_boost: 5.0
  scheduler_aging_per_second: 2.0
  native_chunk_frames: 1
  denoise: true
  temperature: 0.7
  # Chờ scheduler riêng với timeout tạo PCM đầu tiên. Multi-session có thể
  # queue bounded mà không bị hiểu nhầm thành native inference treo.
  admission_timeout_ms: 5000
  # Deadline tách riêng: generation không cắt playback dài đang phát bình thường.
  first_chunk_timeout_ms: 1500
  stall_timeout_ms: 1500

# Hành vi hội thoại tự nhiên phía server. Không yêu cầu sửa/build firmware Xiaozhi nguyên bản.
# Semantic intent luôn do AI quyết định; các field legacy bên dưới vẫn được parser
# chấp nhận để cấu hình cũ load được nhưng không dùng làm matcher user text/template.
conversation:
  # Các field wake_words/exit_commands/greeting_* legacy vẫn load được từ
  # config cũ nhưng không còn nằm trên config surface vì semantic routing do AI.
  enabled: false
  audio_cache_enabled: true
  # 0 = tắt idle watchdog.
  idle_timeout_seconds: 120
  history_turns: 6
  # AI summary chỉ chạy nền sau response, bị cancel ngay khi có turn mới và
  # dùng low-priority quota để không tranh critical path voice.
  history_summary_enabled: true
  history_summary_high_water_turns: 5
  history_summary_min_new_turns: 3
  history_summary_max_chars: 1200
  history_summary_defer_ms: 250
  goodbye_enabled: true
  end_intent_ai_enabled: true
  ai_control_timeout_ms: 1800
  wake_start_wait_ms: 150
  fixed_response_timeout_seconds: 5
  close_grace_ms: 250

latency:
  # 600ms là mục tiêu warm-path tới audio đầu; timeout rộng hơn để chịu jitter.
  target_first_audio_ms: 600
  first_token_timeout_ms: 1800
  total_turn_timeout_ms: 15000
  # Toàn request LLM được giữ trong budget này. Server ước lượng 4 ký tự/token
  # để tránh thêm tokenizer vào đường realtime; llm.max_tokens được giữ lại làm
  # output reserve trước khi history/memory/tool schema được nhét vào request.
  context_max_tokens: 8192
  context_chars_per_token: 4

# API quản trị (/api/prompt, /api/test-voice). Nên cấp token bằng biến môi
# trường VEETEE_MANAGEMENT_TOKEN, không ghi secret vào file cấu hình/repo.
# Khi token trống, các endpoint quản trị trả 401; OTA/WebSocket vẫn hoạt động.
management:
  test_voice_max_concurrency: 1
  test_voice_requests_per_minute: 12

intent:
  enabled: true
  semantic_end_enabled: true
  confirmation_ttl_seconds: 15

memory:
  # Session memory hoạt động local; durable write chỉ bật khi operator gắn
  # trusted_owner_id từ cấu hình server. Không dùng Device-Id/Client-Id làm owner.
  enabled: true
  durable_enabled: false
  database_path: "data/memory.sqlite3"
  trusted_owner_id: ""
  lookup_timeout_ms: 10
  top_k: 6
  max_memory_chars: 2400
  # Không persist mutation từ transcript giọng nói có acoustic confidence thấp.
  min_asr_confidence_for_write: 0.82

tools:
  enabled: true
  native_enabled: true
  mcp_device_enabled: false
  max_calls_per_turn: 3
  schema_limit: 16
  # Chat vẫn 1 inference. Turn có action được phép bounded follow-up rounds
  # để chain A->B rồi synthesis; trần 1..4 đã test, không chạy vô hạn.
  max_llm_rounds_per_turn: 3
  tool_result_synthesis: true
  max_parallel_read_only: 2

# Nhạc YouTube: tìm/phát/điều khiển bằng giọng nói, stream Opus về loa.
# Cần mạng tới YouTube + package yt-dlp. Thiết bị không cần thay đổi.
music:
  enabled: true
  search_results: 5
  resolve_timeout_s: 20.0
  stall_timeout_s: 12.0
  # 6 frame x 60 ms để hấp thụ jitter; stock Xiaozhi có ~1.2s decode queue.
  send_ahead_ms: 360
