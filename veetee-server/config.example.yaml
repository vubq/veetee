# Copy file này thành config.yaml rồi chỉnh theo máy chạy server.
# config.yaml được .gitignore bỏ qua; không commit API key thật.

server:
  timezone: "Asia/Bangkok"
  host: "0.0.0.0"
  ws_port: 8000
  http_port: 8003
  log_level: "INFO"
  # Tương thích firmware Xiaozhi nguyên bản: chỉ ngắt khi client gửi abort/listen:start.
  barge_in_policy: "client_only"

asr:
  # Mặc định: Parakeet Vietnamese local + Silero VAD.
  # Có thể đổi thành "deepgram"; khi đó cần api_key và các option Deepgram bên dưới.
  provider: "parakeet_silero"
  api_key: ""
  model: "nvidia/parakeet-ctc-0.6b-vi"
  language: "vi"
  smart_format: true
  interim_results: true
  endpointing_ms: 250
  sample_rate: 16000

  # Parakeet + Silero VAD
  device: "cuda"
  vad_model_path: "models/silero-vad/silero_vad.onnx"
  vad_threshold: 0.5
  vad_threshold_low: 0.3
  min_silence_duration_ms: 450
  min_speech_duration_ms: 160
  speech_start_frames: 2
  pre_speech_pad_ms: 512

  # Tắt mặc định để giữ critical path ASR -> 1 LLM -> TTS.
  # Chỉ bật khi muốn ưu tiên sửa transcript confidence thấp hơn latency.
  text_correction_enabled: false
  text_correction_confidence_threshold: 0.78
  text_correction_timeout_ms: 900
  # Bounded queue để lượt capture cũ không chiếm GPU vô hạn.
  utterance_queue_max: 2
  max_utterance_ms: 30000
  # Chẩn đoán ASR: lưu vòng một số ít WAV + JSON sau inference để A/B decoder/model.
  # Ghi file chạy ngoài critical path nên không chặn LLM/TTS.
  diagnostic_capture_enabled: false
  diagnostic_capture_dir: "/tmp/veetee-asr-captures"
  diagnostic_capture_max_files: 20

llm:
  # provider: "groq" (Groq API trực tiếp, quota-aware multi-key) hoặc
  # "omniroute" (gateway local cũ). Không còn OmniRoute trong đường mới.
  provider: "groq"
  base_url: "https://api.groq.com/openai/v1"
  api_key: "local-omniroute"
  model: "qwen/qwen3.6-27b"
  # Pool key Groq: secret CHỈ ở env (GROQ_API_KEY_<alias>), file này chỉ giữ
  # id + quota_group. Số lượng key linh hoạt; pool rỗng = tự quét env.
  # Mỗi alias mặc định một quota_group riêng (quota độc lập).
  key_pool:
    - {id: "A", api_key_env: "GROQ_API_KEY_A", quota_group: "gA", enabled: true}
    - {id: "B", api_key_env: "GROQ_API_KEY_B", quota_group: "gB", enabled: true}
    - {id: "C", api_key_env: "GROQ_API_KEY_C", quota_group: "gC", enabled: true}
    - {id: "D", api_key_env: "GROQ_API_KEY_D", quota_group: "gD", enabled: true}
  # Caps quota theo group (rpm/rpd/tpm/tpd/itpm/otpm). Bỏ trống group nào thì
  # group đó chạy discovery mode (giới hạn in-flight, học caps từ headers).
  # Không bịa quota tài khoản khác.
  quota_groups: {}
  routing:
    headroom_pct: 10.0
    max_attempts: 2
    admission_wait_ms: 50.0
    discovery_max_inflight: 1
    inflight_penalty_s: 0.4
  temperature: 0.6
  max_tokens: 600
  reasoning_format: "hidden"
  # Effort suy luận cho model mặc định ("none" tắt <think> kiểu Qwen).
  reasoning_effort: "none"
  # Model phụ để A/B test (không thay default). Effort riêng từng model
  # vì gpt-oss chỉ nhận low/medium/high.
  extra_models: ["openai/gpt-oss-20b"]
  model_reasoning_effort:
    "openai/gpt-oss-20b": "low"
  base_prompt: "Bạn là VeeTee, một trợ lý ảo giọng nói tiếng Việt thông minh, thân thiện và hữu ích."
  prompt_template: "agent-base-prompt.txt"
  # Persona budget dùng chung cho API/UI/config/runtime. Over-budget bị reject,
  # không truncate âm thầm. Estimate có safety margin cho tiếng Việt/JSON.
  base_prompt_max_bytes: 32768
  base_prompt_max_tokens: 8000

tts:
  provider: "vieneu"
  voice: "Xuân Vĩnh"
  source_voice: "Xuân Vĩnh"
  sample_rate: 24000
  frame_duration_ms: 60
  # Giới hạn audio gửi trước để giảm đuôi âm khi client ngắt lượt.
  send_ahead_ms: 120
  # Backpressure cho bridge VieNeu thread -> async.
  stream_queue_max_chunks: 4
  denoise: true
  temperature: 0.7
  # Deadline tách riêng: generation không cắt playback dài đang phát bình thường.
  first_chunk_timeout_ms: 4000
  stall_timeout_ms: 2500

# Hành vi hội thoại tự nhiên phía server. Không yêu cầu sửa/build firmware Xiaozhi nguyên bản.
# Semantic intent luôn do AI quyết định; các field legacy bên dưới vẫn được parser
# chấp nhận để cấu hình cũ load được nhưng không dùng làm matcher user text/template.
conversation:
  enabled: false
  # LEGACY/INERT: không dùng để nhận wake phrase.
  wake_words:
    - "你好小智"
    - "小爱同学"
    - "小美同学"
    - "VeeTee ơi"
  greeting_enabled: true
  greeting_ai_enabled: true
  # LEGACY/INERT: không còn round-robin greeting pool.
  greeting_pool_size: 3
  # LEGACY/INERT: không dùng làm literal greeting fallback.
  greeting_text: ""
  audio_cache_enabled: true
  # 0 = tắt idle watchdog. Khi >0, mỗi inactivity epoch được AI đánh giá 1 lần.
  idle_timeout_seconds: 120
  # LEGACY/INERT: không dùng để nhận exit phrase.
  exit_commands:
    - "tạm biệt"
    - "kết thúc trò chuyện"
    - "thoát trò chuyện"
  goodbye_enabled: true
  goodbye_ai_enabled: true
  end_intent_ai_enabled: true
  ai_control_timeout_ms: 1800
  # LEGACY/INERT: không dùng làm literal goodbye fallback.
  goodbye_text: ""
  # Giá trị khởi điểm cần đo trên thiết bị thật.
  wake_start_wait_ms: 150
  fixed_response_timeout_seconds: 5
  close_grace_ms: 250

latency:
  unified_turn_enabled: true
  first_token_timeout_ms: 6000
  total_turn_timeout_ms: 15000
  context_lookup_timeout_ms: 10
  # Toàn request LLM được giữ trong budget này. Server ước lượng 4 ký tự/token
  # để tránh thêm tokenizer vào đường realtime; llm.max_tokens được giữ lại làm
  # output reserve trước khi history/memory/tool schema được nhét vào request.
  context_max_tokens: 8192
  context_chars_per_token: 4

# API quản trị (/api/prompt, /api/test-voice). Nên cấp token bằng biến môi
# trường VEETEE_MANAGEMENT_TOKEN, không ghi secret vào file cấu hình/repo.
# Khi token trống, các endpoint quản trị trả 401; OTA/WebSocket vẫn hoạt động.
management:
  test_voice_max_concurrency: 1
  test_voice_requests_per_minute: 12

intent:
  enabled: true
  semantic_end_enabled: true
  confirmation_ttl_seconds: 15

memory:
  # Session memory hoạt động local; durable write chỉ bật khi operator gắn
  # trusted_owner_id từ cấu hình server. Không dùng Device-Id/Client-Id làm owner.
  enabled: true
  durable_enabled: false
  database_path: "data/memory.sqlite3"
  trusted_owner_id: ""
  lookup_timeout_ms: 10
  top_k: 6
  max_memory_chars: 2400

tools:
  enabled: true
  native_enabled: true
  mcp_device_enabled: false
  max_calls_per_turn: 3
  schema_limit: 16
  # Chat vẫn 1 inference. Turn có action được phép bounded follow-up rounds
  # để chain A->B rồi synthesis; trần 1..4 đã test, không chạy vô hạn.
  max_llm_rounds_per_turn: 2
  tool_result_synthesis: true
  max_parallel_read_only: 2
