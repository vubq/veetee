<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const storageKey = "veetee.manager.theme";
        let preference = "system";
        try {
          const saved = localStorage.getItem(storageKey);
          if (saved === "light" || saved === "system" || saved === "dark") preference = saved;
        } catch {}
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        const root = document.documentElement;
        root.dataset.themePreference = preference;
        root.dataset.theme = resolved;
        root.style.colorScheme = resolved;
      })();
    </script>
    <style>
      html, body { min-height: 100%; background: #f3f3ed; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0d1719; }
    </style>
    <title>Veetee Manager</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
