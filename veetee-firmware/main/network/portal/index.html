<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thiết lập Veetee</title><link rel="stylesheet" href="/portal.css"></head><body><main><header class="hero"><div class="brand-row"><span class="brand"><i></i><i></i></span><span><b>veetee</b><small data-t="brand">THIẾT LẬP THIẾT BỊ</small></span><em><i></i><span data-t="nearby">Ở GẦN ROBOT</span></em></div><span class="eyebrow" data-t="eyebrow">KẾT NỐI NHANH</span><h1 data-t="title"></h1><p data-t="intro"></p><ol><li class="active"><b>1</b><span data-t="stepWifi">Wi-Fi</span></li><li><b>2</b><span data-t="stepConnect">Kết nối</span></li><li><b>3</b><span data-t="stepPair">Ghép thiết bị</span></li></ol></header><form id="setup" novalidate><section><div class="section-head"><div><small data-t="networkEyebrow">MẠNG GẦN ĐÂY</small><h2 data-t="networkTitle">Chọn Wi-Fi</h2></div><button type="button" id="refresh" data-t="rescan">Quét lại</button></div><p id="scanStatus" class="scan-status" role="status" aria-live="polite" data-t="scanning">Đang tìm các mạng gần đây…</p><div id="networkList" class="network-list" role="group" aria-labelledby="networkListLabel"></div><span id="networkListLabel" class="sr-only" data-t="networkListLabel">Các mạng Wi-Fi ở gần</span><label for="ssid"><span data-t="ssid">Tên mạng</span><input id="ssid" name="ssid" maxlength="32" required aria-describedby="ssidError" data-t-placeholder="hiddenPlaceholder" placeholder="Wi-Fi hoặc mạng ẩn"><small id="ssidError" class="field-error"></small></label><label for="password"><span data-t="password">Mật khẩu Wi-Fi</span><div class="password-wrap"><input id="password" name="password" type="password" maxlength="64" aria-describedby="passwordError"><button type="button" id="togglePassword" aria-controls="password" aria-pressed="false" data-t="show" data-t-label="showPassword">Hiện</button></div><small id="passwordError" class="field-error"></small></label></section><details id="advanced"><summary><span data-t="advanced">Cài đặt nâng cao</span><b>+</b></summary><div class="advanced-grid"><label for="bootstrapUrl"><span data-t="bootstrap">Máy chủ Veetee</span><input id="bootstrapUrl" name="bootstrap_url" maxlength="256" inputmode="url" required aria-describedby="bootstrapHint bootstrapError" placeholder="http://192.168.1.10:8001/veetee/ota/"><small id="bootstrapHint" data-t="bootstrapHint"></small><small id="bootstrapError" class="field-error"></small></label><label for="locale"><span data-t="language">Ngôn ngữ</span><select id="locale" name="locale"><option value="vi-VN" data-t="vietnamese">Tiếng Việt</option><option value="en-US" data-t="english">English</option></select></label><label for="timeZone"><span data-t="timezone">Múi giờ IANA</span><input id="timeZone" name="time_zone" maxlength="64" value="Asia/Bangkok" required aria-describedby="timeZoneError"><small id="timeZoneError" class="field-error"></small></label><label for="wakeProfile"><span data-t="wake">Wake profile ID</span><input id="wakeProfile" name="wake_profile" maxlength="64"></label></div></details><button class="submit" type="submit"><span data-t="connect">Kết nối Wi-Fi</span><b>→</b></button><div id="status" class="status" role="status" aria-live="polite"></div><div id="errorStatus" class="status error" role="alert" aria-live="assertive"></div><aside class="security"><i>!</i><p data-t="security"></p></aside></form><section id="success" class="success" role="status" aria-live="polite" tabindex="-1" hidden><span>✓</span><small data-t="successEyebrow">WI-FI ĐÃ SẴN SÀNG</small><h2 data-t="successTitle">Veetee đã vào mạng của bạn.</h2><p data-t="successBody"></p></section></main><script src="/portal-en.js"></script><script src="/portal-i18n.js"></script><script src="/portal-ui.js"></script><script src="/portal.js"></script></body></html>
